[package]
name = "ep-testkit"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lints]
workspace = true

# 按裁定 B-01，探针 schema 与探针表由 ci-probe feature 保护，默认关闭。
# 发布制品的 `cargo tree -e features` 输出中不得出现该 feature（阶段 14 的 RG-CI-PROBE-ABSENT）。
[features]
ci-probe = []

[dependencies]
ep-foundation.workspace = true
# 内存幂等实现要实现 async_trait 端口，实现侧需同名宏。
async-trait.workspace = true

[dev-dependencies]
# 仅测试构造 Id 与幂等键需要 uuid；库代码不具名引用该类型。
uuid.workspace = true
