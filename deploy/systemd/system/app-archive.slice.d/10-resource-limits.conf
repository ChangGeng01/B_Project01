# 规格第 13.1 章配额表第 8 行「连续归档、附件增量与审计证据写出组件」，
# CPU 2%、内存 3%、磁盘 IO 6%。承载进程为 archive-writer。
[Slice]
# 本行的磁盘 IO 份额下界是 RPO 不超过 15 分钟成立的必要条件，
# 该条件由份额下界本身保证，不由本行与 app-backup.slice 的相对高低保证——
# 规格该表给 backup-writer 的是 10%，高于本行的 6%，原「归档 IOWeight 高于备份」的特例已撤销。
CPUWeight=200
IOWeight=600
# archive-writer 内部三项写出之间的先后由该进程自身调度，cgroup 不在 slice 内部区分优先级。
MemoryLow=1957691392
MemoryMax=1957691392
