# F-57：HISTORICAL_LINUX_RESEARCH_ONLY；禁止用于当前 Windows Server 2022 生产部署或发布验收。
# 规格第 13.1 章配额表第 1 行「PostgreSQL 16」，CPU 44%、内存 48%、磁盘 IO 50%。
# 四类取值的口径与算定式见 deploy/README.md，判定方是 scripts/verify-resource-limits.sh。
[Slice]
# 权重是相对份额，只在竞争时收敛；其余 slice 空闲时本 slice 可借用其空闲部分。
# 因此本行的 44% 不等于整机的 44%，八行权重之和是 9000 而非 10000，缺口见 README 的偏差一。
CPUWeight=4400
IOWeight=5000
# 保底与上限同值：内存超售会触发内核终止进程，反而损害备份完成性与可恢复性目标。
MemoryLow=31335645184
MemoryMax=31335645184
