# F-57：HISTORICAL_LINUX_RESEARCH_ONLY；禁止用于当前 Windows Server 2022 生产部署或发布验收。
# 规格第 13.1 章配额表第 9 行「全量备份、附件存量搬运与备份校验组件」，
# CPU 3%、内存 5%、磁盘 IO 10%。承载进程为 backup-writer。
[Slice]
CPUWeight=300
IOWeight=1000
MemoryLow=3263168512
MemoryMax=3263168512
# 八行中唯一的硬上限，压住每晚的全量窗口：磁盘 IO 是本机唯一真实稀缺的一维，
# 权重只在竞争时收敛，压不住业务空闲时段备份把设备吃满、进而抬高备份窗口内交易时延的情形。
# cgroup v2 的 io.max 把读写分成 rbps 与 wbps 两个键，计划所称「一个 MB/s 数字」因此落成同值两行；
# systemd 无名为 IOMax 的指令，io.max 的承载指令即下列两条，见 README 的取值缺口三。
# 200 MiB/s，设备按 /var/lib/ep 所在块设备解析。
IOReadBandwidthMax=/var/lib/ep 209715200
IOWriteBandwidthMax=/var/lib/ep 209715200
