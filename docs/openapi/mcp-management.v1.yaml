openapi: 3.1.0
info:
  title: Enterprise Platform MCP Management and Inbound API — F-55 exact surface
  version: 1.0.0-f55
  description: |
    本文件保留 F-55 MCP 管理面与入站 POST /mcp 的固定九 operation 历史输入，
    不是现行 F-57 独立权威契约。该固定九模型已由 F-57 动态签名 manifest
    capability 模型取代；下列 API 形状仅供 Tasks 14/16 再基线参考。
  x-f57-status: HISTORICAL_SUPERSEDED
  x-source-authority: F-55-section-4-historical-input
  x-planned-implementation-tasks: [F57-14, F57-16]
  x-implementation-state: NOT_IMPLEMENTED
  x-scope: exact-nine-operation-surface
  x-path-count: 9
  x-operation-count: 9
  x-mcp-protocol-version: '2026-07-28'
  x-mcp-stable-error-count: 20
  x-stable-error-codes:
    - PLATFORM.REQUEST.INVALID_PAYLOAD
    - PLATFORM.REQUEST.HEADER_MISSING
    - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
    - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
    - PLATFORM.CONCURRENCY.STALE_VERSION
    - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
    - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
    - PLATFORM.SYSTEM.SYNC_TIMEOUT
    - MCP.PROTOCOL.VERSION_UNSUPPORTED
    - MCP.REQUEST.INVALID
    - MCP.PAYLOAD.TOO_LARGE
    - MCP.PROTOCOL.HEADER_MISMATCH
    - MCP.METHOD.NOT_ALLOWED
    - MCP.MANIFEST.INVALID_OR_UNSIGNED
    - MCP.MANIFEST.CAPABILITY_DENIED
    - MCP.GRANT.INVALID_OR_EXPIRED
    - MCP.DEVICE_PROOF.INVALID
    - MCP.TOOL.NOT_VISIBLE_OR_DENIED
    - MCP.RESOURCE.NOT_VISIBLE_OR_DENIED
    - MCP.TOOL.HIGH_RISK_FORBIDDEN
    - MCP.IDEMPOTENCY.REQUIRED
    - MCP.CREDENTIAL.REF_INVALID
    - MCP.REMOTE.UNAVAILABLE
    - MCP.RESPONSE.SCHEMA_INVALID
    - MCP.LOCAL.CONTAINMENT_FAILED
    - MCP.AUDIT.UNAVAILABLE
    - MCP.RATE_LIMITED
    - MCP.CALL.TIMEOUT
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
tags:
  - name: McpConnectors
  - name: McpHumanGrants
  - name: McpInbound
security:
  - bearerAuth: []
paths:
  /api/v1/platform/mcp-connectors:
    get:
      tags: [McpConnectors]
      operationId: listMcpConnectors
      summary: 分页查看当前管理范围内的 MCP 连接器
      description: |
        query 只接受 cursor 与 page_size，未知参数以及 limit/page/sort/filter 均拒绝。
        排序固定为 created_at DESC,id DESC；cursor 只表示位置，服务端每页重做完整授权。
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ServerAdminClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ConnectorCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: MCP 连接器键集分页结果
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpConnectorListSuccess'}
        '400': {$ref: '#/components/responses/ManagementError400'}
        '403': {$ref: '#/components/responses/ManagementError403'}
        '503': {$ref: '#/components/responses/ManagementError503'}
      x-permission: platform.mcp.connector.manage
      x-action: VIEW
      x-query-parameters-closed: true
      x-forbidden-query-parameters: [limit, page, sort, filter]
      x-ordering: created_at DESC,id DESC
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /api/v1/platform/mcp-connectors/{id}:
    get:
      tags: [McpConnectors]
      operationId: getMcpConnector
      summary: 查看连接器、活动清单、健康和最近审计摘要
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ServerAdminClient'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 完整且脱敏的 MCP 连接器详情
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpConnectorDetailSuccess'}
        '400': {$ref: '#/components/responses/ManagementError400'}
        '403': {$ref: '#/components/responses/ManagementError403'}
        '404': {$ref: '#/components/responses/ManagementError404'}
        '409': {$ref: '#/components/responses/ManagementManifestError409'}
        '503': {$ref: '#/components/responses/ManagementError503'}
      x-permission: platform.mcp.connector.manage
      x-action: VIEW
      x-query-parameters-closed: true
      x-not-found-policy: absent-and-record-denied-are-indistinguishable
      x-forbidden-response-fields: [secret, credential_value, request_name, request_uri, request_payload, response_payload]
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
        - MCP.MANIFEST.INVALID_OR_UNSIGNED
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /api/v1/platform/mcp-connectors/{id}/manifest-versions:
    get:
      tags: [McpConnectors]
      operationId: listMcpConnectorManifestVersions
      summary: 分页查看连接器不可变 manifest 版本
      description: |
        query 只接受 cursor 与 page_size；排序固定为 version_no DESC,id DESC。
        manifest 正文、signature 正文、origin、credential 和安装路径均不返回。
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ServerAdminClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ManifestVersionCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: manifest 版本键集分页结果
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpManifestVersionListSuccess'}
        '400': {$ref: '#/components/responses/ManagementError400'}
        '403': {$ref: '#/components/responses/ManagementError403'}
        '404': {$ref: '#/components/responses/ManagementError404'}
        '409': {$ref: '#/components/responses/ManagementManifestError409'}
        '503': {$ref: '#/components/responses/ManagementError503'}
      x-permission: platform.mcp.connector.manage
      x-action: VIEW
      x-query-parameters-closed: true
      x-forbidden-query-parameters: [limit, page, sort, filter]
      x-ordering: version_no DESC,id DESC
      x-not-found-policy: absent-and-record-denied-are-indistinguishable
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
        - MCP.MANIFEST.INVALID_OR_UNSIGNED
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /api/v1/platform/mcp-connectors/{id}/actions/enable:
    post:
      tags: [McpConnectors]
      operationId: enableMcpConnector
      summary: 启用具有活动已批准 manifest 的连接器
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ServerAdminClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpConnectorEnableRequest'}
      responses:
        '200':
          description: 连接器已启用
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpConnectorEnableSuccess'}
        '400': {$ref: '#/components/responses/ManagementWriteError400'}
        '403': {$ref: '#/components/responses/ManagementError403'}
        '404': {$ref: '#/components/responses/ManagementError404'}
        '409': {$ref: '#/components/responses/ManagementEnableError409'}
        '503': {$ref: '#/components/responses/ManagementEnableError503'}
      x-permission: platform.mcp.connector.manage
      x-action: UPDATE
      x-query-parameters-closed: true
      x-not-found-policy: absent-and-record-denied-are-indistinguishable
      x-idempotency: required
      x-preconditions: [unique-active-approved-manifest, credential-probe-passed, license-valid]
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
        - MCP.MANIFEST.INVALID_OR_UNSIGNED
        - MCP.CREDENTIAL.REF_INVALID
        - MCP.LOCAL.CONTAINMENT_FAILED
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /api/v1/platform/mcp-connectors/{id}/actions/disable:
    post:
      tags: [McpConnectors]
      operationId: disableMcpConnector
      summary: 停用连接器并保留其数据、版本和审计
      parameters:
        - $ref: '#/components/parameters/ConnectorId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/ServerAdminClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpConnectorDisableRequest'}
      responses:
        '200':
          description: 连接器已停用，既有数据仍安全保留
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpConnectorDisableSuccess'}
        '400': {$ref: '#/components/responses/ManagementWriteError400'}
        '403': {$ref: '#/components/responses/ManagementError403'}
        '404': {$ref: '#/components/responses/ManagementError404'}
        '409': {$ref: '#/components/responses/ManagementError409'}
        '503': {$ref: '#/components/responses/ManagementError503'}
      x-permission: platform.mcp.connector.manage
      x-action: UPDATE
      x-query-parameters-closed: true
      x-not-found-policy: absent-and-record-denied-are-indistinguishable
      x-idempotency: required
      x-state-lock: connector-session-advisory-exclusive-through-terminal-inflight
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /api/v1/platform/mcp-human-grants/actions/issue:
    post:
      tags: [McpHumanGrants]
      operationId: issueMcpHumanGrant
      summary: 为当前已登录人员和设备签发短期最小授权
      description: |
        Idempotency-Key 明确禁止；携带时返回 PLATFORM.REQUEST.INVALID_PAYLOAD，
        details 只含字段级原因 “Idempotency-Key is forbidden for this endpoint”。
        bearer_token_once 仅在本次成功响应出现一次，不进入通用响应缓存；响应丢失
        后不能重放旧 token，只能撤销旧 grant（或等待过期）再重新签发。
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/GrantClient'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpHumanGrantIssueRequest'}
      responses:
        '201':
          description: 已签发一次性显示的短期 bearer token
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpHumanGrantIssueSuccess'}
        '400': {$ref: '#/components/responses/ManagementError400'}
        '403': {$ref: '#/components/responses/ManagementGrantIssueError403'}
        '404': {$ref: '#/components/responses/ManagementGrantIssueError404'}
        '409': {$ref: '#/components/responses/ManagementManifestError409'}
        '503': {$ref: '#/components/responses/ManagementError503'}
      x-permission: platform.mcp.grant.issue
      x-action: CREATE
      x-query-parameters-closed: true
      x-not-found-policy: connector-or-manifest-absent-and-record-denied-are-indistinguishable
      x-idempotency: forbidden
      x-forbidden-request-headers: [Idempotency-Key]
      x-response-cache: forbidden
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
        - MCP.MANIFEST.CAPABILITY_DENIED
        - MCP.TOOL.NOT_VISIBLE_OR_DENIED
        - MCP.RESOURCE.NOT_VISIBLE_OR_DENIED
        - MCP.MANIFEST.INVALID_OR_UNSIGNED
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /api/v1/platform/mcp-human-grants:
    get:
      tags: [McpHumanGrants]
      operationId: listActiveMcpHumanGrants
      summary: 分页查看当前可见的活动 MCP 人类授权
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/GrantClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ActiveGrantState'
        - $ref: '#/components/parameters/GrantCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 仅包含 ACTIVE grant 的键集分页结果
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpHumanGrantListSuccess'}
        '400': {$ref: '#/components/responses/ManagementError400'}
        '403': {$ref: '#/components/responses/ManagementError403'}
        '503': {$ref: '#/components/responses/ManagementError503'}
      x-query-parameters-closed: true
      x-forbidden-query-parameters: [limit, page, sort, filter]
      x-ordering: issued_at DESC,id DESC
      x-authorization:
        owner: current valid session/device and item.user_id equals current user
        non_owner: platform.mcp.connector.manage + VIEW and target connector current object scope
      x-token-fields-forbidden: [bearer_token_once, token_hash, device_public_key, source_session_id]
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /api/v1/platform/mcp-human-grants/{id}/actions/revoke:
    post:
      tags: [McpHumanGrants]
      operationId: revokeMcpHumanGrant
      summary: 撤销本人或当前安全管理范围内的 MCP 人类授权
      parameters:
        - $ref: '#/components/parameters/GrantId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/GrantClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpHumanGrantRevokeRequest'}
      responses:
        '200':
          description: grant 已不可逆撤销
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpHumanGrantRevokeSuccess'}
        '400': {$ref: '#/components/responses/ManagementWriteError400'}
        '403': {$ref: '#/components/responses/ManagementError403'}
        '404': {$ref: '#/components/responses/ManagementError404'}
        '409': {$ref: '#/components/responses/ManagementError409'}
        '503': {$ref: '#/components/responses/ManagementError503'}
      x-idempotency: required
      x-query-parameters-closed: true
      x-authorization:
        owner: current valid session/device and grant.user_id equals current user
        non_owner: platform.mcp.connector.manage + UPDATE and target connector current object scope
      x-not-found-policy: absent-and-record-denied-are-indistinguishable
      x-error-codes:
        - PLATFORM.REQUEST.INVALID_PAYLOAD
        - PLATFORM.REQUEST.HEADER_MISSING
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.AUTHZ.OBJECT_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
        - PLATFORM.SYSTEM.SYNC_TIMEOUT
  /mcp:
    post:
      tags: [McpInbound]
      operationId: invokeInboundMcp
      summary: 使用短期人类 grant 与设备证明调用冻结的 MCP 六方法
      description: |
        唯一协议版本为 2026-07-28，应用方法恰为 server/discover、tools/list、
        tools/call、resources/list、resources/templates/list、resources/read；ping、
        initialize、notification、response、batch 与未知方法均拒绝。Content-Type
        必须精确为 application/json，Accept 必须精确为
        application/json, text/event-stream。Mcp-Method 必须与 body method 逐字
        相等；Mcp-Name 只在 tools/call 与 resources/read 必填并分别等于
        params.name/params.uri，其余四方法必须缺席。Authorization bearer token、
        Mcp-Name 和全部设备证明 header 均按 secret 脱敏。
        外部提交 X-Client（尤其 X-Client:mcp）不建立任何身份；该 header 被拒绝，
        ClientKind::Mcp 只由 grant middleware 内部赋值。未知普通 HTTP header 忽略；
        HTTP header 名按 ASCII 大小写不敏感处理；normalized lower-case 前缀
        mcp-param-（展示名 Mcp-Param-*）不参与路由、授权或审计，但其所有
        mixed/lower/upper case 变体仍在 proxy、core、gateway、tracing、access log、
        错误与 crash metadata 全链按 secret 脱敏。
        设备证明的 exact LF preimage、对完整 bearer token 与 exact HTTP body bytes
        的 SHA-256、low-S 校验以及 counter/audit 顺序逐字遵循 live F-55 §4.2/§4.7。
      security:
        - mcpHumanBearer: []
      parameters:
        - $ref: '#/components/parameters/McpAccept'
        - $ref: '#/components/parameters/McpProtocolVersion'
        - $ref: '#/components/parameters/McpMethod'
        - $ref: '#/components/parameters/McpName'
        - $ref: '#/components/parameters/McpGrantId'
        - $ref: '#/components/parameters/McpDeviceId'
        - $ref: '#/components/parameters/McpProofCounter'
        - $ref: '#/components/parameters/McpProofTimestamp'
        - $ref: '#/components/parameters/McpProof'
      requestBody:
        required: true
        x-max-exact-http-body-bytes: 1048576
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpJsonRpcRequest'}
      responses:
        '200':
          description: 单一即时 application/json terminal JSON-RPC result；不建立 session 或重放流
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAcceptedRequired'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/McpJsonRpcSuccessResponse'}
        '400': {$ref: '#/components/responses/McpError400'}
        '403': {$ref: '#/components/responses/McpError403'}
        '404': {$ref: '#/components/responses/McpError404'}
        '409': {$ref: '#/components/responses/McpError409'}
        '413': {$ref: '#/components/responses/McpError413'}
        '429': {$ref: '#/components/responses/McpError429'}
        '502': {$ref: '#/components/responses/McpError502'}
        '503': {$ref: '#/components/responses/McpError503'}
        '504': {$ref: '#/components/responses/McpError504'}
      x-required-header-values:
        Authorization: Bearer epmcp1.<43 canonical base64url-no-pad chars>
        Content-Type: application/json
        Accept: application/json, text/event-stream
        MCP-Protocol-Version: '2026-07-28'
      x-query-parameters-closed: true
      x-conditional-headers:
        Mcp-Method: required-and-exact-body-method-match
        Mcp-Name: required-for-tools-call-or-resources-read-and-forbidden-otherwise
      x-product-transport-header-contract-closed: true
      x-unknown-http-headers: ignored-without-routing-or-authorization-effect
      x-mcp-param-headers: ignored-without-routing-authorization-or-audit-effect
      x-ignored-request-header-prefixes-ascii-case-insensitive: [mcp-param-]
      x-secret-request-headers:
        - Authorization
        - Mcp-Name
        - X-EP-MCP-Grant-Id
        - X-EP-MCP-Device-Id
        - X-EP-MCP-Proof-Counter
        - X-EP-MCP-Proof-Timestamp
        - X-EP-MCP-Proof
      x-secret-request-header-prefixes-ascii-case-insensitive: [mcp-param-]
      x-secret-header-case-variant-canary-required: true
      x-secret-header-zero-persistence-surfaces: [reverse-proxy, core, gateway, tracing, access-log, error, crash-metadata]
      x-secret-response-headers: [X-EP-MCP-Proof-Counter-Accepted]
      x-forbidden-request-headers: [Mcp-Session-Id, Last-Event-ID, X-Client]
      x-request-json-bytes-max: 1048576
      x-terminal-json-bytes-max: 8388608
      x-sse-terminal-body-bytes-max-outbound-only: 8388631
      x-route-timeout-ms: 32000
      x-mcp-deadline-ms: 30000
      x-get-delete-status: 405
      x-error-codes:
        - MCP.PROTOCOL.VERSION_UNSUPPORTED
        - MCP.REQUEST.INVALID
        - MCP.PAYLOAD.TOO_LARGE
        - MCP.PROTOCOL.HEADER_MISMATCH
        - MCP.METHOD.NOT_ALLOWED
        - MCP.MANIFEST.INVALID_OR_UNSIGNED
        - MCP.MANIFEST.CAPABILITY_DENIED
        - MCP.GRANT.INVALID_OR_EXPIRED
        - MCP.DEVICE_PROOF.INVALID
        - MCP.TOOL.NOT_VISIBLE_OR_DENIED
        - MCP.RESOURCE.NOT_VISIBLE_OR_DENIED
        - MCP.TOOL.HIGH_RISK_FORBIDDEN
        - MCP.IDEMPOTENCY.REQUIRED
        - MCP.CREDENTIAL.REF_INVALID
        - MCP.REMOTE.UNAVAILABLE
        - MCP.RESPONSE.SCHEMA_INVALID
        - MCP.LOCAL.CONTAINMENT_FAILED
        - MCP.AUDIT.UNAVAILABLE
        - MCP.RATE_LIMITED
        - MCP.CALL.TIMEOUT
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
    mcpHumanBearer:
      type: http
      scheme: bearer
      bearerFormat: epmcp1-canonical-one-time-secret
      description: |
        Authorization 必须为 Bearer 后接 exact 50-byte token：
        `epmcp1.` + 43-char canonical base64url-no-pad（解码恰 32 random bytes）。
      x-bearer-token-schema: '#/components/schemas/McpHumanBearerToken'
  parameters:
    ConnectorId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/LowercaseUuid'}
    GrantId:
      name: id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/LowercaseUuid'}
    LegalEntityId:
      name: X-Legal-Entity-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/LowercaseUuid'}
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/DeviceIdentifier'}
    ServerAdminClient:
      name: X-Client
      in: header
      required: true
      schema:
        type: string
        const: server_admin
    GrantClient:
      name: X-Client
      in: header
      required: true
      schema:
        type: string
        enum: [win, mac, ios, android, server_admin]
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: {$ref: '#/components/schemas/RequestIdentifier'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端为本次写入生成的 canonical lowercase UUIDv7。
      schema: {$ref: '#/components/schemas/LowercaseUuidV7'}
    ConnectorCursor:
      name: cursor
      in: query
      required: false
      description: |
        epcur1.<base64url-no-pad>；解码后的 endpoint-bound RFC 8785 JCS 为
        1..512 bytes，endpoint 固定 MCP_CONNECTORS，位置键为 created_at,id。
        必须解码、重做 JCS/base64url 并与输入逐 byte 相等；不回显输入 cursor。
      schema: {$ref: '#/components/schemas/EpCursor'}
      x-endpoint: MCP_CONNECTORS
      x-sort-key: created_at DESC,id DESC
      x-decoded-schema: '#/components/schemas/McpConnectorsCursorV1'
    ManifestVersionCursor:
      name: cursor
      in: query
      required: false
      description: |
        epcur1.<base64url-no-pad>；解码后的 endpoint-bound RFC 8785 JCS 为
        1..512 bytes，绑定 connector_id 与 endpoint MCP_MANIFEST_VERSIONS，位置键为
        version_no,id。服务端生成新 cursor，不回显输入。
      schema: {$ref: '#/components/schemas/EpCursor'}
      x-endpoint: MCP_MANIFEST_VERSIONS
      x-sort-key: version_no DESC,id DESC
      x-decoded-schema: '#/components/schemas/McpManifestVersionsCursorV1'
    GrantCursor:
      name: cursor
      in: query
      required: false
      description: |
        epcur1.<base64url-no-pad>；解码后的 endpoint-bound RFC 8785 JCS 为
        1..512 bytes，endpoint 固定 MCP_HUMAN_GRANTS_ACTIVE，位置键为 issued_at,id。
        服务端生成新 cursor，不回显输入。
      schema: {$ref: '#/components/schemas/EpCursor'}
      x-endpoint: MCP_HUMAN_GRANTS_ACTIVE
      x-sort-key: issued_at DESC,id DESC
      x-decoded-schema: '#/components/schemas/McpHumanGrantsActiveCursorV1'
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ActiveGrantState:
      name: state
      in: query
      required: true
      schema:
        type: string
        const: ACTIVE
    McpAccept:
      name: Accept
      in: header
      required: true
      description: 必须逐字为 `application/json, text/event-stream`；不接受协商改写。
      schema:
        type: string
        const: application/json, text/event-stream
      x-openapi-special-header-runtime-required: true
    McpProtocolVersion:
      name: MCP-Protocol-Version
      in: header
      required: true
      schema:
        type: string
        const: '2026-07-28'
    McpMethod:
      name: Mcp-Method
      in: header
      required: true
      description: 必须与 JSON-RPC body method 逐字相等且大小写敏感。
      schema: {$ref: '#/components/schemas/McpAllowedMethod'}
    McpName:
      name: Mcp-Name
      in: header
      required: false
      description: |
        tools/call 时必填并等于 params.name；resources/read 时必填并等于
        params.uri；server/discover、tools/list、resources/list、
        resources/templates/list 时必须缺席。安全值直接传输，否则使用 F-55
        canonical `=?base64?{RFC4648-standard-base64-with-padding}?=`；header 最多
        2743 bytes，解码后 UTF-8 最多 2048 bytes，只解码一次并逐 byte 比对；
        解码值再次匹配 sentinel、多个 sentinel 或任何尾随字节均拒绝。
      schema:
        oneOf:
          - type: string
            minLength: 1
            maxLength: 2048
            pattern: '^(?![=][?]base64[?])[!-~]+$'
          - type: string
            minLength: 15
            maxLength: 2743
            pattern: '^[=][?]base64[?](?:(?:[A-Za-z0-9+/]{4})+|(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=))[?]=$'
            x-decoded-utf8-bytes: 1..2048
            x-canonical-round-trip-required: true
            x-decoded-sentinel: forbidden
      x-conditional-required: tools/call-or-resources/read
      x-forbidden-for: [server/discover, tools/list, resources/list, resources/templates/list]
    McpGrantId:
      name: X-EP-MCP-Grant-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/LowercaseUuid'}
    McpDeviceId:
      name: X-EP-MCP-Device-Id
      in: header
      required: true
      schema: {$ref: '#/components/schemas/DeviceIdentifier'}
    McpProofCounter:
      name: X-EP-MCP-Proof-Counter
      in: header
      required: true
      description: canonical 无前导零 u64 十进制文本；首个 counter 为 1，之后严格加一。
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,19}$'
        maxLength: 20
        x-decoded-type: u64
        x-decoded-maximum: 18446744073709551615
    McpProofTimestamp:
      name: X-EP-MCP-Proof-Timestamp
      in: header
      required: true
      description: canonical 无前导零 Unix seconds；服务器验收时必须位于当前时间 ±60 秒。
      schema:
        type: string
        pattern: '^(?:0|[1-9][0-9]{0,18})$'
        maxLength: 19
        x-decoded-type: nonnegative-int64
        x-decoded-maximum: 9223372036854775807
    McpProof:
      name: X-EP-MCP-Proof
      in: header
      required: true
      description: canonical base64url-no-pad 的 low-S IEEE-P1363 ECDSA P-256 r||s，解码恰 64 bytes。
      schema:
        type: string
        minLength: 86
        maxLength: 86
        pattern: '^[A-Za-z0-9_-]{85}[AQgw]$'
        x-decoded-bytes: 64
        x-canonical-round-trip-required: true
  headers:
    XRequestId:
      required: true
      schema: {$ref: '#/components/schemas/RequestIdentifier'}
    XTraceId:
      required: true
      schema: {$ref: '#/components/schemas/TraceId'}
    IdempotentReplay:
      description: 同一幂等载荷成功重放时为 true；首次响应可以省略。
      schema: {type: boolean}
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
    McpProofCounterAccepted:
      required: false
      description: |
        仅 counter 原子 UPDATE 成功后出现，值必须等于本次请求 counter；随后所有
        成功、业务/权限/外部失败以及 ATTEMPT 审计失败都必须带。UPDATE 前的协议、
        header、token、proof、rate、inflight 拒绝不得带。客户端无此 header 时不推进
        counter；网络结果不确定时撤销 grant 并重签，绝不猜测重试。本 header 必须
        透传但不得进入日志、tracing、错误正文、审计或 CORS 通配暴露。
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,19}$'
        maxLength: 20
        x-decoded-type: u64
        x-decoded-maximum: 18446744073709551615
    McpProofCounterAcceptedRequired:
      required: true
      description: |
        Counter UPDATE 已成功；本 header 必须出现且值逐字等于请求 counter。
        代理只透传，不得记录、追踪或通过 CORS 通配暴露。
      schema:
        type: string
        pattern: '^[1-9][0-9]{0,19}$'
        maxLength: 20
        x-decoded-type: u64
        x-decoded-maximum: 18446744073709551615
  schemas:
    LowercaseUuid:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    LowercaseUuidV7:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    RequestIdentifier:
      type: string
      minLength: 8
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    DeviceIdentifier:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    TraceId:
      type: string
      pattern: '^[0-9a-f]{32}$'
    Sha256LowerHex:
      type: string
      pattern: '^[0-9a-f]{64}$'
    McpHumanBearerToken:
      type: string
      minLength: 50
      maxLength: 50
      pattern: '^epmcp1\.[A-Za-z0-9_-]{43}$'
      x-decoded-random-bytes: 32
      x-canonical-base64url-round-trip-required: true
    UtcRfc3339:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]+)?Z$'
    NullableUtcRfc3339:
      oneOf:
        - $ref: '#/components/schemas/UtcRfc3339'
        - type: 'null'
    NullableLowercaseUuid:
      oneOf:
        - $ref: '#/components/schemas/LowercaseUuid'
        - type: 'null'
    NullableString:
      type: [string, 'null']
    RowVersion:
      type: integer
      format: int64
      minimum: 0
      maximum: 9223372036854775807
    SecurityLevel:
      type: integer
      enum: [10, 20, 30, 40]
    DataScopeTags:
      type: array
      minItems: 0
      maxItems: 256
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-z0-9_-]+:[A-Za-z0-9_-]+$'
      x-runtime-order: ascending-UTF-8-bytes
    EpCursor:
      type: string
      minLength: 8
      maxLength: 690
      pattern: '^epcur1\.[A-Za-z0-9_-]{1,683}$'
      description: 解码后 1..512 bytes 的 endpoint-bound RFC 8785 JCS；必须 canonical round-trip。
      x-decoded-min-bytes: 1
      x-decoded-max-bytes: 512
      x-canonicalization: RFC8785-JCS-then-RFC4648-base64url-no-pad
    CursorUtcMicroseconds:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{6}Z$'
    McpConnectorsCursorV1:
      type: object
      additionalProperties: false
      required: [schema_version, endpoint, created_at, id]
      properties:
        schema_version: {const: 1}
        endpoint: {const: MCP_CONNECTORS}
        created_at: {$ref: '#/components/schemas/CursorUtcMicroseconds'}
        id: {$ref: '#/components/schemas/LowercaseUuid'}
      x-max-jcs-bytes: 512
    McpManifestVersionsCursorV1:
      type: object
      additionalProperties: false
      required: [schema_version, endpoint, connector_id, version_no, id]
      properties:
        schema_version: {const: 1}
        endpoint: {const: MCP_MANIFEST_VERSIONS}
        connector_id: {$ref: '#/components/schemas/LowercaseUuid'}
        version_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        id: {$ref: '#/components/schemas/LowercaseUuid'}
      x-max-jcs-bytes: 512
      x-path-binding: connector_id equals path id
    McpHumanGrantsActiveCursorV1:
      type: object
      additionalProperties: false
      required: [schema_version, endpoint, issued_at, id, state]
      properties:
        schema_version: {const: 1}
        endpoint: {const: MCP_HUMAN_GRANTS_ACTIVE}
        issued_at: {$ref: '#/components/schemas/CursorUtcMicroseconds'}
        id: {$ref: '#/components/schemas/LowercaseUuid'}
        state: {const: ACTIVE}
      x-max-jcs-bytes: 512
    McpDirection:
      type: string
      enum: [INBOUND, OUTBOUND]
    McpTransport:
      type: string
      enum: [INBOUND_HTTPS, REMOTE_STREAMABLE_HTTP, LOCAL_SIGNED_STDIO, LOCAL_WINDOWS_HYPERV_CONTAINER]
    McpConnectorStatus:
      type: string
      enum: [REGISTERED, PENDING_APPROVAL, ENABLED, DISABLED, REVOKED]
    McpManifestStatus:
      type: string
      enum: [DRAFT, PENDING_APPROVAL, APPROVED, ACTIVE, SUPERSEDED, REJECTED, REVOKED]
    McpAllowedMethod:
      type: string
      enum: [server/discover, tools/list, tools/call, resources/list, resources/templates/list, resources/read]
    McpConnectorListItemV1:
      type: object
      additionalProperties: false
      required: [id, code, name, direction, transport, status, security_level, data_scope_tags, row_version, created_at, updated_at]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUuid'}
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9._-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        direction: {$ref: '#/components/schemas/McpDirection'}
        transport: {$ref: '#/components/schemas/McpTransport'}
        status: {$ref: '#/components/schemas/McpConnectorStatus'}
        security_level: {$ref: '#/components/schemas/SecurityLevel'}
        data_scope_tags: {$ref: '#/components/schemas/DataScopeTags'}
        row_version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {$ref: '#/components/schemas/UtcRfc3339'}
        updated_at: {$ref: '#/components/schemas/UtcRfc3339'}
      x-invariant: INBOUND uses INBOUND_HTTPS; OUTBOUND uses one of the other three transports.
    McpActiveManifestSummaryV1:
      type: object
      additionalProperties: false
      required: [id, version_no, protocol_version, manifest_digest, signer_subject, status, approved_at, activated_at]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUuid'}
        version_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        protocol_version: {const: '2026-07-28'}
        manifest_digest: {$ref: '#/components/schemas/Sha256LowerHex'}
        signer_subject:
          type: string
          minLength: 1
          maxLength: 512
        status: {const: ACTIVE}
        approved_at: {$ref: '#/components/schemas/UtcRfc3339'}
        activated_at: {$ref: '#/components/schemas/UtcRfc3339'}
    NullableMcpActiveManifestSummaryV1:
      oneOf:
        - $ref: '#/components/schemas/McpActiveManifestSummaryV1'
        - type: 'null'
    McpConnectorHealthV1:
      type: object
      additionalProperties: false
      required: [state, checked_at, stable_code]
      properties:
        state:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, NOT_APPLICABLE]
        checked_at: {$ref: '#/components/schemas/NullableUtcRfc3339'}
        stable_code:
          oneOf:
            - $ref: '#/components/schemas/McpStableErrorCode'
            - type: 'null'
      oneOf:
        - properties:
            state: {const: HEALTHY}
            checked_at: {$ref: '#/components/schemas/UtcRfc3339'}
            stable_code: {type: 'null'}
        - properties:
            state:
              type: string
              enum: [DEGRADED, UNAVAILABLE]
            checked_at: {$ref: '#/components/schemas/UtcRfc3339'}
            stable_code: {$ref: '#/components/schemas/McpStableErrorCode'}
        - properties:
            state: {const: NOT_APPLICABLE}
            checked_at: {type: 'null'}
            stable_code: {type: 'null'}
    McpRecentAuditSummaryV1:
      type: object
      additionalProperties: false
      required: [last_invocation_at, last_outcome, last_incident_no]
      properties:
        last_invocation_at: {$ref: '#/components/schemas/NullableUtcRfc3339'}
        last_outcome:
          oneOf:
            - type: string
              enum: [SUCCEEDED, REJECTED, FAILED, TIMEOUT, CANCELLED, UNKNOWN_AFTER_CRASH]
            - type: 'null'
        last_incident_no:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 128
            - type: 'null'
      oneOf:
        - properties:
            last_invocation_at: {type: 'null'}
            last_outcome: {type: 'null'}
            last_incident_no: {type: 'null'}
        - properties:
            last_invocation_at: {$ref: '#/components/schemas/UtcRfc3339'}
            last_outcome: {const: SUCCEEDED}
            last_incident_no:
              oneOf:
                - type: string
                  minLength: 1
                  maxLength: 128
                - type: 'null'
        - properties:
            last_invocation_at: {$ref: '#/components/schemas/UtcRfc3339'}
            last_outcome:
              type: string
              enum: [REJECTED, FAILED, TIMEOUT, CANCELLED, UNKNOWN_AFTER_CRASH]
            last_incident_no:
              type: string
              minLength: 1
              maxLength: 128
    McpConnectorDetailV1:
      type: object
      additionalProperties: false
      required: [id, code, name, direction, transport, status, security_level, data_scope_tags, row_version, created_at, updated_at, active_manifest, health, recent_audit]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUuid'}
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9._-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        direction: {$ref: '#/components/schemas/McpDirection'}
        transport: {$ref: '#/components/schemas/McpTransport'}
        status: {$ref: '#/components/schemas/McpConnectorStatus'}
        security_level: {$ref: '#/components/schemas/SecurityLevel'}
        data_scope_tags: {$ref: '#/components/schemas/DataScopeTags'}
        row_version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {$ref: '#/components/schemas/UtcRfc3339'}
        updated_at: {$ref: '#/components/schemas/UtcRfc3339'}
        active_manifest: {$ref: '#/components/schemas/NullableMcpActiveManifestSummaryV1'}
        health: {$ref: '#/components/schemas/McpConnectorHealthV1'}
        recent_audit: {$ref: '#/components/schemas/McpRecentAuditSummaryV1'}
      x-forbidden-fields:
        - manifest_json
        - signature
        - signature_key_ref
        - credential_ref
        - credential_value
        - installed_root_ref
        - request_name
        - request_uri
        - request_payload
        - response_payload
    McpManifestVersionAdminViewV1:
      type: object
      additionalProperties: false
      required: [id, connector_id, version_no, protocol_version, manifest_digest, signer_subject, transport, status, approval_ref, approved_at, rejected_at, rejected_reason, activated_at, superseded_at, materialized, row_version, created_at]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUuid'}
        connector_id: {$ref: '#/components/schemas/LowercaseUuid'}
        version_no:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        protocol_version: {const: '2026-07-28'}
        manifest_digest: {$ref: '#/components/schemas/Sha256LowerHex'}
        signer_subject:
          type: string
          minLength: 1
          maxLength: 512
        transport: {$ref: '#/components/schemas/McpTransport'}
        status: {$ref: '#/components/schemas/McpManifestStatus'}
        approval_ref: {$ref: '#/components/schemas/NullableLowercaseUuid'}
        approved_at: {$ref: '#/components/schemas/NullableUtcRfc3339'}
        rejected_at: {$ref: '#/components/schemas/NullableUtcRfc3339'}
        rejected_reason:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: 'null'
        activated_at: {$ref: '#/components/schemas/NullableUtcRfc3339'}
        superseded_at: {$ref: '#/components/schemas/NullableUtcRfc3339'}
        materialized: {type: boolean}
        row_version: {$ref: '#/components/schemas/RowVersion'}
        created_at: {$ref: '#/components/schemas/UtcRfc3339'}
      x-status-nullability-invariants:
        - DRAFT has all approval, result and activation fields null.
        - PENDING_APPROVAL has approval_ref and no conclusion or activation time.
        - APPROVED, ACTIVE and SUPERSEDED have approval_ref and approved_at and no rejection fields.
        - ACTIVE also has activated_at; SUPERSEDED also has activated_at and superseded_at.
        - REJECTED has approval_ref, rejected_at and rejected_reason and no approval or activation fields.
        - REVOKED only preserves facts formed on its prior legal path.
      oneOf:
        - properties:
            status: {const: DRAFT}
            approval_ref: {type: 'null'}
            approved_at: {type: 'null'}
            rejected_at: {type: 'null'}
            rejected_reason: {type: 'null'}
            activated_at: {type: 'null'}
            superseded_at: {type: 'null'}
        - properties:
            status: {const: PENDING_APPROVAL}
            approval_ref: {$ref: '#/components/schemas/LowercaseUuid'}
            approved_at: {type: 'null'}
            rejected_at: {type: 'null'}
            rejected_reason: {type: 'null'}
            activated_at: {type: 'null'}
            superseded_at: {type: 'null'}
        - properties:
            status: {const: APPROVED}
            approval_ref: {$ref: '#/components/schemas/LowercaseUuid'}
            approved_at: {$ref: '#/components/schemas/UtcRfc3339'}
            rejected_at: {type: 'null'}
            rejected_reason: {type: 'null'}
            activated_at: {type: 'null'}
            superseded_at: {type: 'null'}
        - properties:
            status: {const: ACTIVE}
            approval_ref: {$ref: '#/components/schemas/LowercaseUuid'}
            approved_at: {$ref: '#/components/schemas/UtcRfc3339'}
            rejected_at: {type: 'null'}
            rejected_reason: {type: 'null'}
            activated_at: {$ref: '#/components/schemas/UtcRfc3339'}
            superseded_at: {type: 'null'}
        - properties:
            status: {const: SUPERSEDED}
