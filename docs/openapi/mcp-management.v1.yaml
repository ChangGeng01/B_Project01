  responses:
    ManagementError400:
      description: 管理请求 header、字段、cursor、page_size 或禁止的幂等头无效
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope400'}
    ManagementWriteError400:
      description: 管理写请求 header、字段或必需 Idempotency-Key 无效
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementWriteErrorEnvelope400'}
    ManagementError403:
      description: 当前主体对对象类型或动作无权；不返回策略细节
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope403'}
    ManagementGrantIssueError403:
      description: 无对象权限，或请求能力不属于当前 ACTIVE manifest
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementGrantIssueErrorEnvelope403'}
    ManagementError404:
      description: 对象不存在或对当前范围不可见；同码同形态
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope404'}
    ManagementGrantIssueError404:
      description: connector/manifest 不存在或不可见，或 manifest 内能力被当前范围裁剪
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementGrantIssueErrorEnvelope404'}
    ManagementError409:
      description: 幂等载荷、row_version、状态或 manifest 完整性冲突
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope409'}
    ManagementManifestError409:
      description: 当前 manifest 形状、签名或完整性事实无效
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementManifestErrorEnvelope409'}
    ManagementEnableError409:
      description: enable 的幂等载荷、row_version、状态或 manifest 完整性冲突
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementEnableErrorEnvelope409'}
    ManagementError503:
      description: 管理请求同步处理或必要本地收容/credential 检查不可用
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope503'}
    ManagementEnableError503:
      description: 同步处理、credential probe 或本地收容检查不可用
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ManagementEnableErrorEnvelope503'}
    McpError400:
      description: 非法 JSON/request、协议版本/header 或 owner command 幂等标识无效
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAccepted'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse400'}
      x-accepted-counter-header:
        absent: [MCP.REQUEST.INVALID, MCP.PROTOCOL.VERSION_UNSUPPORTED, MCP.PROTOCOL.HEADER_MISMATCH]
        required-after-counter-update: [MCP.IDEMPOTENCY.REQUIRED]
    McpError403:
      description: grant、device proof、manifest capability 或高风险禁区拒绝
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAccepted'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse403'}
      x-accepted-counter-header:
        absent: [MCP.GRANT.INVALID_OR_EXPIRED, MCP.DEVICE_PROOF.INVALID]
        required-after-counter-update: [MCP.MANIFEST.CAPABILITY_DENIED, MCP.TOOL.HIGH_RISK_FORBIDDEN]
    McpError404:
      description: 方法、tool 或 resource 不允许/不可见，不泄露存在性
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAccepted'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse404'}
      x-accepted-counter-header:
        absent: [MCP.METHOD.NOT_ALLOWED]
        required-after-counter-update: [MCP.TOOL.NOT_VISIBLE_OR_DENIED, MCP.RESOURCE.NOT_VISIBLE_OR_DENIED]
    McpError409:
      description: manifest 形状、签名或当前完整性事实无效
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAcceptedRequired'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse409'}
    McpError413:
      description: request 或 terminal payload 超过固定字节上限
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAccepted'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse413'}
      x-accepted-counter-header:
        absent-trigger: inbound request body exceeds 1048576 bytes before counter update
        required-trigger: terminal response exceeds 8388608 bytes after counter update
    McpError429:
      description: connector 固定速率或在途容量命中；counter UPDATE 前不消费调用
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse429'}
      x-accepted-counter-header: forbidden-before-counter-update
    McpError502:
      description: 远端不可用或 terminal response schema 无效
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAcceptedRequired'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse502'}
    McpError503:
      description: credential、local containment 或审计确认不可用；MCP.AUDIT.UNAVAILABLE 禁止自动重试
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAccepted'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse503'}
      x-audit-unavailable-automatic-retry: forbidden
      x-accepted-counter-header: conditional-on-whether-the-single-counter-update-already-committed
    McpError504:
      description: MCP 调用超过 30 秒绝对时限
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
        X-EP-MCP-Proof-Counter-Accepted: {$ref: '#/components/headers/McpProofCounterAcceptedRequired'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/McpRpcErrorResponse504'}
