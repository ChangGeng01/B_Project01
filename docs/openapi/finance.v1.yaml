          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        attachment_object_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
      allOf:
        - if:
            properties:
              refund_type:
                const: CUSTOMER_REFUND
            required: [refund_type]
          then:
            properties:
              return_doc_type:
                const: SALES_RETURN
              source_payments:
                type: array
                items:
                  type: object
                  properties:
                    source_doc_type:
                      const: RECEIPT
          else:
            properties:
              return_doc_type:
                const: PURCHASE_RETURN
              source_payments:
                type: array
                items:
                  type: object
                  properties:
                    source_doc_type:
                      const: PAYMENT
