            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverbillingSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission: finance.overbilling_entry:write_off
      x-idempotency: required
      x-reauth: required
      x-error-codes:
        - FINANCE.OVERBILLING_ENTRY.WRITTEN_OFF_REQUIRES_REVERSAL
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.REAUTH_REQUIRED
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/overbilling-entries/{id}/actions/reverse-write-off:
    post:
      tags: [Overbilling]
      operationId: reverseOverbillingWriteOff
      summary: 审批后冲回超量开票路径三核销
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ReauthToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OverbillingReverseWriteOffRequest'}
      responses:
        '200':
          description: 路径三核销已冲回
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverbillingSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission: finance.overbilling_entry:reverse
      x-idempotency: required
      x-reauth: required
      x-error-codes:
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.REAUTH_REQUIRED
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/reconciliations:
    get:
      tags: [Reconciliations]
      operationId: listReconciliations
      summary: 查询十项子账总账勾稽
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - name: accounting_period_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: item
          in: query
          schema: {type: string}
      responses:
        '200':
          description: 十项子账侧、总账侧、差额与差异事项引用
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReconciliationListSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.reconciliation:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes: [PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED]
  /api/v1/finance/cash-ledger-entries:
    get:
      tags: [Ledgers]
      operationId: listCashLedgerEntries
      summary: 查询全法人资金腿明细
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AccountingPeriodIdQuery'
        - name: filter[cash_account_id]
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 分页资金腿明细
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashLedgerEntryListSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.cash_account:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes: [PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED]
  /api/v1/finance/opening-balances/actions/import:
    post:
      tags: [OpeningBalances]
      operationId: importOpeningBalances
      summary: 导入往来及预收预付期初余额
      description: 逐行独立事务；成功行不因其他行失败而回滚，且本入口不生成凭证。
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OpeningBalanceImportRequest'}
      responses:
        '200':
          description: 逐行导入结果
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OpeningBalanceImportSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission:
        RECEIVABLE: finance.receivable_entry:create
        PAYABLE: finance.payable_entry:create
        ADVANCE_RECEIPT: finance.advance_entry:create
        ADVANCE_PAYMENT: finance.advance_entry:create
      x-idempotency: required
      x-reauth: not-required
      x-error-codes:
        - FINANCE.OPENING_BALANCE.PERIOD_NOT_FIRST
        - FINANCE.OPENING_BALANCE.ROW_LIMIT_EXCEEDED
        - FINANCE.OPENING_BALANCE.PARTY_NOT_FOUND
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LegalEntityId:
      name: X-Legal-Entity-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    InternalClient:
      name: X-Client
      in: header
      required: true
      schema:
        type: string
        enum: [win, mac, ios, android, ops]
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 客户端生成的 UUIDv7；X-Reauth-Token 不参与 request_hash。
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    ReauthToken:
      name: X-Reauth-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    OptionalReauthToken:
      name: X-Reauth-Token
      in: header
      required: false
      description: 仅在请求完整银行账号字段时提交；成功读取必须写审计。
      schema:
        type: string
        minLength: 1
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    AccountingPeriodIdQuery:
      name: accounting_period_id
      in: query
      required: false
      schema: {type: string, format: uuid}
    AgingGroupBy:
      name: group_by
      in: query
      required: false
      schema:
        type: string
        enum: [customer, contract, sales_order, bucket]
        default: customer
    AgingBucketFilter:
      name: filter[bucket_code]
      in: query
      required: false
      schema: {type: string, pattern: '^eq:[A-Za-z0-9_-]+$'}
    AgingExpand:
      name: expand
      in: query
      required: false
      schema: {type: string, enum: [entries]}
  headers:
    XRequestId:
      schema:
        type: string
    XTraceId:
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    IdempotentReplay:
      description: 同一幂等载荷重放时为 true；首次响应可以省略。
      schema:
        type: boolean
  schemas:
    PositiveMoney:
      type: string
      description: 大于 0 的 numeric(18,2) 十进制定点字符串。
      pattern: '^(?:0\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,15}\.[0-9]{2})$'
      examples: ['100.00']
    Money:
      type: string
      description: 非负 numeric(18,2) 十进制定点字符串。
      pattern: '^(?:0|[1-9][0-9]{0,15})\.[0-9]{2}$'
      examples: ['0.00']
    SignedMoney:
      type: string
      description: numeric(18,2) 有符号十进制定点字符串。
      pattern: '^-?(?:0|[1-9][0-9]{0,15})\.[0-9]{2}$'
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 200}
        total: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
        next_cursor: {type: [string, 'null']}
    RowVersionActionRequest:
      type: object
      additionalProperties: false
      required: [row_version]
      properties:
        row_version: {type: integer, minimum: 1}
    CashAccountCreateRequest:
      type: object
      additionalProperties: false
      required:
        - code
        - account_name
        - account_type
        - ledger_account_id
        - owner_user_id
        - opening_balance
        - opening_balance_period_id
      properties:
        code: {type: string, minLength: 1, maxLength: 32, pattern: '^[A-Z0-9_-]+$'}
        account_name: {type: string, minLength: 1, maxLength: 200}
        account_type: {type: string, enum: [BANK, CASH]}
        ledger_account_id: {type: string, format: uuid}
        bank_name: {type: [string, 'null'], maxLength: 200}
        bank_account_no: {type: [string, 'null'], minLength: 4, maxLength: 64}
        owner_user_id: {type: string, format: uuid}
        opening_balance: {$ref: '#/components/schemas/SignedMoney'}
        opening_balance_period_id: {type: [string, 'null'], format: uuid}
        remark: {type: [string, 'null'], maxLength: 2000}
      allOf:
        - if:
            properties: {account_type: {const: BANK}}
            required: [account_type]
          then:
            required: [bank_name, bank_account_no]
          else:
            properties:
              bank_account_no: {type: 'null'}
              bank_name: {type: 'null'}
        - if:
            properties:
              opening_balance: {not: {const: '0.00'}}
            required: [opening_balance]
          then:
            properties:
              opening_balance_period_id: {type: string, format: uuid}
    CashAccountPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [row_version]
      properties:
        row_version: {type: integer, minimum: 1}
        account_name: {type: string, minLength: 1, maxLength: 200}
        bank_name: {type: [string, 'null'], maxLength: 200}
        bank_account_no: {type: [string, 'null'], minLength: 4, maxLength: 64}
        owner_user_id: {type: string, format: uuid}
        remark: {type: [string, 'null'], maxLength: 2000}
    CashAccount:
      type: object
      additionalProperties: false
      required:
        - id
        - legal_entity_id
        - code
        - account_name
        - account_type
        - ledger_account_id
        - owner_user_id
        - opening_balance
        - opening_balance_period_id
        - bank_account_no_last4
        - is_active
        - has_cash_flow
        - row_version
      properties:
        id: {type: string, format: uuid}
        legal_entity_id: {type: string, format: uuid}
        code: {type: string}
        account_name: {type: string}
        account_type: {type: string, enum: [BANK, CASH]}
        ledger_account_id: {type: string, format: uuid}
        owner_user_id: {type: string, format: uuid}
        opening_balance: {$ref: '#/components/schemas/SignedMoney'}
        opening_balance_period_id: {type: [string, 'null'], format: uuid}
        bank_name: {type: [string, 'null'], readOnly: true}
        bank_account_no_last4: {type: [string, 'null'], pattern: '^[0-9A-Za-z]{4}$', readOnly: true}
        bank_account_no: {type: [string, 'null'], readOnly: true}
        is_active: {type: boolean}
        deactivated_at: {type: [string, 'null'], format: date-time}
        has_cash_flow: {type: boolean, readOnly: true}
        remark: {type: [string, 'null']}
        row_version: {type: integer, minimum: 1}
    CashAccountListData:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CashAccount'}
    SettlementLineInput:
      type: object
      additionalProperties: false
      required: [entry_id, settled_amount, expected_effective_open]
      properties:
        entry_id: {type: string, format: uuid}
        settled_amount: {$ref: '#/components/schemas/PositiveMoney'}
        expected_effective_open: {$ref: '#/components/schemas/Money'}
    ReceiptCreateRequest:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - receipt_date
        - posting_date
        - receipt_amount
        - cash_account_id
        - settlement_lines
        - is_manual_settlement_order
      properties:
        customer_id: {type: string, format: uuid}
        receipt_date: {type: string, format: date}
        posting_date: {type: string, format: date}
        receipt_amount: {$ref: '#/components/schemas/PositiveMoney'}
        cash_account_id: {type: string, format: uuid}
        settlement_lines:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/SettlementLineInput'}
        is_manual_settlement_order: {type: boolean}
        attachment_object_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        remark: {type: [string, 'null'], maxLength: 1000}
    PaymentCreateRequest:
      type: object
      additionalProperties: false
      required:
        - payment_request_id
        - supplier_id
        - payment_date
        - posting_date
        - payment_amount
        - cash_account_id
        - settlement_lines
      properties:
        payment_request_id: {type: string, format: uuid}
        supplier_id: {type: string, format: uuid}
        payment_date: {type: string, format: date}
        posting_date: {type: string, format: date}
        payment_amount: {$ref: '#/components/schemas/PositiveMoney'}
        cash_account_id: {type: string, format: uuid}
        settlement_lines:
          type: array
          maxItems: 200
          items: {$ref: '#/components/schemas/SettlementLineInput'}
        attachment_object_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
        remark: {type: [string, 'null'], maxLength: 1000}
    SettlementEffect:
      type: object
      additionalProperties: false
      required:
        - id
        - entry_id
        - effect_kind
        - root_apply_id
        - settled_amount
        - source_doc_type
        - source_doc_id
        - business_date
        - accounting_period_id
      properties:
        id: {type: string, format: uuid}
        entry_id: {type: string, format: uuid}
        effect_kind:
          type: string
          enum: [APPLY, RELEASE]
          description: 金额方向的唯一判据；不得从 reverses_id 是否为空推断方向
        funding_origin:
          type: [string, 'null']
          enum: [DIRECT_CASH, ADVANCE_AUTO, null]
          description: 仅应收/应付效果非空；预收/预付效果固定为空
        root_apply_id: {type: string, format: uuid}
        reverses_id: {type: [string, 'null'], format: uuid}
        settled_amount: {$ref: '#/components/schemas/PositiveMoney'}
        source_doc_type:
          type: string
          enum:
            - RECEIPT
            - PAYMENT
            - SALES_INVOICE
            - PURCHASE_INVOICE
            - CUSTOMER_REFUND
            - SUPPLIER_REFUND
            - INVOICE_REVERSAL
            - CASH_DOC_REVERSAL
        source_doc_id: {type: string, format: uuid}
        funding_receipt_id: {type: [string, 'null'], format: uuid}
        funding_payment_id: {type: [string, 'null'], format: uuid}
        funding_advance_receipt_entry_id: {type: [string, 'null'], format: uuid}
        funding_advance_payment_entry_id: {type: [string, 'null'], format: uuid}
        target_type:
          type: [string, 'null']
          enum: [RECEIVABLE_ENTRY, PAYABLE_ENTRY, CUSTOMER_REFUND, SUPPLIER_REFUND, CASH_DOC_REVERSAL, null]
          description: 仅预收/预付效果非空，取值须与台账侧匹配
        target_id: {type: [string, 'null'], format: uuid}
        refund_source_payment_link_id: {type: [string, 'null'], format: uuid}
        business_date: {type: string, format: date}
        accounting_period_id: {type: string, format: uuid}
    ReceiptDocument:
      type: object
      additionalProperties: false
      required: [id, doc_no, document_type, party_id, document_date, posting_date, amount, cash_account_id, settlement_amount, advance_amount, refunded_amount, settlement_effects, status, accounting_period_id, voucher_id, row_version, is_deferred]
      properties:
        id: {type: string, format: uuid}
        doc_no: {type: string}
        document_type: {const: RECEIPT}
        party_id: {type: string, format: uuid, description: customer_id}
        document_date: {type: string, format: date, description: receipt_date}
        posting_date: {type: string, format: date}
        amount: {$ref: '#/components/schemas/PositiveMoney'}
        cash_account_id: {type: string, format: uuid}
        settlement_amount:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: 最终追溯到本到款资金根的 DIRECT_CASH 与 ADVANCE_AUTO 应收核销净额
        advance_amount:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: 本到款资金根下当前预收 advance_open 合计
        refunded_amount:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: 未冲正客户退款来源链接合计
        settlement_effects:
          type: array
          items: {$ref: '#/components/schemas/SettlementEffect'}
        status: {type: string, enum: [DRAFT, REGISTERED, CANCELLED, REVERSED]}
        accounting_period_id: {type: [string, 'null'], format: uuid}
        voucher_id: {type: [string, 'null'], format: uuid}
        row_version: {type: integer, minimum: 1}
        is_deferred: {type: boolean}
    PaymentDocument:
      type: object
      additionalProperties: false
