              schema: {$ref: '#/components/schemas/OverbillingListSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.overbilling_entry:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes: [PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED]
  /api/v1/finance/overbilling-entries/{id}:
    get:
      tags: [Overbilling]
      operationId: getOverbillingEntry
      summary: 查询超量开票详情
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
