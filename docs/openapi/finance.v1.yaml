openapi: 3.1.0
info:
  title: Enterprise Platform Finance API — Stage 10 full surface
  version: 1.0.0-stage10
  description: |
    本文件保留阶段 10/F-50 的 33 个 finance HTTP method/path operation，只是 F-57
    当前主题输入，尚待精确再基线；它不是现行、已实现的完整 F-57 机器契约。
    退款由调用方提交逐笔原款项来源及链接金额，
    服务端计算预收/预付消耗与核销释放。资金冲正只提交源单据和事实更正信息；
    `ar_ap_amount`、`advance_amount`、科目、核销释放额等内部拆分永远不是 HTTP 输入。
  x-f57-status: CURRENT_SUBJECT_INPUT_PENDING_EXACT_REBASELINE
  x-source-authority: F-50-current-subject-input
  x-planned-implementation-tasks: [F57-20]
  x-implementation-state: NOT_IMPLEMENTED_AS_FULL_F57_MACHINE_CONTRACT
  x-scope: stage10-full-surface
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
tags:
  - name: CashAccounts
  - name: Settlements
  - name: Receipts
  - name: Payments
  - name: Refunds
  - name: CashDocumentReversals
  - name: Ledgers
  - name: Agings
  - name: Overbilling
  - name: Reconciliations
  - name: OpeningBalances
security:
  - bearerAuth: []
paths:
  /api/v1/finance/cash-accounts:
    post:
      tags: [CashAccounts]
      operationId: createCashAccount
      summary: 创建资金账户
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CashAccountCreateRequest'}
      responses:
        '201':
          description: "`EP__FINANCE__CASH_ACCOUNT__REQUIRES_APPROVAL=false` 时，资金账户已直接创建"
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountSuccess'}
        '202':
          description: "`EP__FINANCE__CASH_ACCOUNT__REQUIRES_APPROVAL=true` 时，仅创建审批申请；资金账户行尚未创建"
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalSubmissionSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission: finance.cash_account:create
      x-idempotency: required
      x-reauth: not-required
      x-approval: cash-account-configured; default-required; approval-callback-revalidates-and-creates
      x-error-codes:
        - FINANCE.CASH_ACCOUNT.ACCOUNT_TYPE_LEDGER_MISMATCH
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
    get:
      tags: [CashAccounts]
      operationId: listCashAccounts
      summary: 查询资金账户列表
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: filter[account_type]
          in: query
          schema: {type: string, enum: [BANK, CASH]}
        - name: filter[is_active]
          in: query
          schema: {type: boolean}
        - name: sort
          in: query
          description: 只允许 `code:asc`，省略时也按 code 升序。
          schema: {type: string, enum: ['code:asc']}
      responses:
        '200':
          description: 分页资金账户；账号只返回脱敏后四位
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountListSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.cash_account:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes:
        - PLATFORM.AUTHZ.SORT_FIELD_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/cash-accounts/{id}:
    get:
      tags: [CashAccounts]
      operationId: getCashAccount
      summary: 查询资金账户详情
      description: |
        默认只返回账号后四位；同时具备 `finance.cash_account.bank_account_no.read_full`、提交有效
        X-Reauth-Token 并写审计时才返回完整账号。bank_name 另需 `finance.cash_account.bank_name.read`。
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/OptionalReauthToken'
      responses:
        '200':
          description: 资金账户详情，字段级权限与重新认证决定敏感字段投影
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountSuccess'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.cash_account:read
      x-field-permissions:
        bank_name: finance.cash_account.bank_name.read
        bank_account_no: finance.cash_account.bank_account_no.read_full
      x-idempotency: not-applicable
      x-reauth: conditional-for-bank-account-no.read_full
      x-error-codes:
        - PLATFORM.AUTHZ.REAUTH_REQUIRED
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
    patch:
      tags: [CashAccounts]
      operationId: updateCashAccount
      summary: 修改资金账户
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CashAccountPatchRequest'}
      responses:
        '200':
          description: "`EP__FINANCE__CASH_ACCOUNT__REQUIRES_APPROVAL=false` 时，资金账户已直接修改"
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountSuccess'}
        '202':
          description: "`EP__FINANCE__CASH_ACCOUNT__REQUIRES_APPROVAL=true` 时，仅创建审批申请；现有账户行保持不变"
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalSubmissionSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission: finance.cash_account:update
      x-idempotency: required
      x-reauth: not-required
      x-approval: cash-account-configured; default-required; approval-callback-revalidates-and-updates
      x-error-codes:
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/cash-accounts/{id}/actions/deactivate:
    post:
      tags: [CashAccounts]
      operationId: deactivateCashAccount
      summary: 停用资金账户
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RowVersionActionRequest'}
      responses:
        '200':
          description: 审批开关关闭时，资金账户已直接停用
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountSuccess'}
        '202':
          description: 审批开关开启时，仅创建停用审批申请；账户仍保持启用
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalSubmissionSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission: finance.cash_account:update
      x-idempotency: required
      x-reauth: not-required
      x-approval: cash-account-configured; default-required; approval-callback-revalidates-and-deactivates
      x-error-codes:
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/cash-accounts/{id}/actions/activate:
    post:
      tags: [CashAccounts]
      operationId: activateCashAccount
      summary: 启用资金账户
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RowVersionActionRequest'}
      responses:
        '200':
          description: 审批开关关闭时，资金账户已直接启用
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashAccountSuccess'}
        '202':
          description: 审批开关开启时，仅创建启用审批申请；账户仍保持停用
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalSubmissionSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission: finance.cash_account:update
      x-idempotency: required
      x-reauth: not-required
      x-approval: cash-account-configured; default-required; approval-callback-revalidates-and-activates
      x-error-codes:
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/cash-accounts/{id}/cash-ledger-entries:
    get:
      tags: [CashAccounts, Ledgers]
      operationId: listCashAccountLedgerEntries
      summary: 查询单一资金账户的资金腿明细
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/AccountingPeriodIdQuery'
      responses:
        '200':
          description: 分页资金腿明细，meta 含期初、期间流入、期间流出与期末余额
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CashLedgerEntryListSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.cash_account:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes: [PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED]
  /api/v1/finance/settlement-proposals:
    get:
      tags: [Settlements]
      operationId: getSettlementProposal
      summary: 按默认核销顺序生成核销建议
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - name: side
          in: query
          required: true
          schema: {type: string, enum: [AR, AP]}
        - name: party_id
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: amount
          in: query
          required: true
          schema: {$ref: '#/components/schemas/PositiveMoney'}
      responses:
        '200':
          description: 默认核销行与转预收或转预付金额
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettlementProposalSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.receivable_entry:read OR finance.payable_entry:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes:
        - FINANCE.SETTLEMENT.PARTY_REQUIRED
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/receipts:
    post:
      tags: [Receipts]
      operationId: createReceipt
      summary: 登记到款并核销应收或转预收
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiptCreateRequest'}
      responses:
        '201':
          description: 审批开关关闭时，到款、核销关系、预收余额、资金腿与凭证已原子写入
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptDocumentSuccess'}
        '202':
          description: 审批开关开启时，仅创建审批申请；到款单、核销效果、预收、资金腿与凭证均尚未创建
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalSubmissionSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
        '503': {$ref: '#/components/responses/Error503'}
      x-permission: finance.receipt:create
      x-idempotency: required
      x-reauth: not-required
      x-approval: receipt-configured; default-not-required; approval-callback-revalidates-and-registers-atomically
      x-error-codes:
        - FINANCE.RECEIPT.AMOUNT_NOT_POSITIVE
        - FINANCE.RECEIPT.CASH_ACCOUNT_DEACTIVATED
        - FINANCE.RECEIPT.DATE_IN_FUTURE
        - FINANCE.SETTLEMENT.AMOUNT_EXCEEDS_EFFECTIVE_OPEN
        - FINANCE.SETTLEMENT.EFFECTIVE_OPEN_CHANGED
        - FINANCE.SETTLEMENT.TOTAL_EXCEEDS_DOCUMENT_AMOUNT
        - FINANCE.RECONCILIATION.BALANCE_MISMATCH
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
    get:
      tags: [Receipts]
      operationId: listReceipts
      summary: 查询到款列表
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: filter[customer_id]
          in: query
          schema: {type: string, format: uuid}
        - name: filter[status]
          in: query
          schema: {type: string}
        - name: filter[receipt_date]
          in: query
          schema: {type: string}
        - name: filter[accounting_period_id]
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 分页到款单
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptDocumentListSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.receipt:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes:
        - PLATFORM.AUTHZ.SORT_FIELD_FORBIDDEN
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/receipts/{id}:
    get:
      tags: [Receipts]
      operationId: getReceipt
      summary: 查询到款详情
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 到款、核销关系、预收余额及凭证追溯
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptDocumentSuccess'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
      x-permission: finance.receipt:read
      x-idempotency: not-applicable
      x-reauth: not-required
      x-error-codes: [PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED]
  /api/v1/finance/receipts/{id}/actions/cancel:
    post:
      tags: [Receipts]
      operationId: cancelReceipt
      summary: 取消草稿到款单
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RowVersionActionRequest'}
      responses:
        '200':
          description: 草稿到款单已取消
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
            Idempotent-Replay: {$ref: '#/components/headers/IdempotentReplay'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptDocumentSuccess'}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
      x-permission: finance.receipt:cancel
      x-idempotency: required
      x-reauth: not-required
      x-error-codes:
        - FINANCE.RECEIPT.INVALID_TRANSITION
        - PLATFORM.CONCURRENCY.STALE_VERSION
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
  /api/v1/finance/payments:
    post:
      tags: [Payments]
      operationId: createPayment
      summary: 登记付款并核销应付或转预付
      parameters:
