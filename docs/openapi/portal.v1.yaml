openapi: 3.1.0
info:
  title: Enterprise Platform Portal API — F-50 affected surface
  version: 1.0.0-f50
  description: |
    本文件保留 F-50 改变的 supplier-invoice-upload HTTP 契约，只是 F-57 当前主题
    输入，尚待精确再基线；它不是现行、已实现的完整 F-57 机器契约。历史上未受
    F-50 影响的 portal v1 路径曾按阶段 7 计划。供应商上传是多行、多税率 staging 记录，
    在 ACCEPTED 前不占用 invoice_number_registry。供应商 HTTP 只可上传与查询；内部财务人员可退回。
    不存在 accept HTTP 端点：ACCEPTED 只能由 POST /api/v1/invoice/purchase-invoices 的统一事务调用
    ep_contract_portal::SupplierInvoiceUploadWritebackPort.accept 推进。
  x-f57-status: CURRENT_SUBJECT_INPUT_PENDING_EXACT_REBASELINE
  x-source-authority: F-50-current-subject-input
  x-planned-implementation-tasks: [F57-22]
  x-implementation-state: NOT_IMPLEMENTED_AS_FULL_F57_MACHINE_CONTRACT
  x-scope: affected-paths-only
  x-prohibited-http-actions:
    - /api/v1/portal/supplier-invoice-uploads/{id}/actions/accept
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
tags:
  - name: SupplierInvoiceUploads
security:
  - bearerAuth: []
paths:
  /api/v1/portal/supplier-invoice-uploads:
    post:
      tags: [SupplierInvoiceUploads]
      operationId: uploadSupplierInvoice
      summary: 供应商上传多行发票待受理记录
      description: |
        supplier_id 与 submitted_by_portal_user_id 从已认证门户会话取得，不接受请求体自报。
        头三项金额由服务端对 lines 求和；头对象禁止 tax_rate、net_amount、untaxed_amount、
        tax_amount、gross_amount。上传号码仅在同法人同供应商的 portal staging 内防重。
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PortalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUploadCreateRequest'
      responses:
        '201':
          description: 上传记录已创建，状态为 UPLOADED
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoiceUploadSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
        '503':
          $ref: '#/components/responses/Error503'
      x-forbidden-head-properties:
        - tax_rate
        - net_amount
        - untaxed_amount
        - tax_amount
        - gross_amount
      x-error-codes:
        - PORTAL.SUPPLIER_INVOICE_UPLOAD.DUPLICATED
        - INVOICE.INVOICE_LINE.HEAD_AMOUNT_FORBIDDEN
        - INVOICE.INVOICE_LINE.TAX_AMOUNT_OUT_OF_TOLERANCE
        - INVOICE.INVOICE_LINE.AMOUNT_EQUATION_INVALID
        - INVOICE.INVOICE_NUMBER.FORMAT_INVALID
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PORTAL.PORTAL_USER.CAPABILITY_NOT_GRANTED
    get:
      tags: [SupplierInvoiceUploads]
      operationId: listSupplierInvoiceUploads
      summary: 供应商查询自身发票上传记录
      parameters:
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/PortalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PortalPageSize'
        - $ref: '#/components/parameters/Cursor'
        - name: filter[status]
          in: query
          schema: {type: string}
        - name: filter[issued_on]
          in: query
          schema: {type: string}
        - name: filter[invoice_no]
          in: query
          schema: {type: string}
        - name: sort
          in: query
          description: 白名单为 `issued_on`、`created_at`、`doc_no`；默认 `created_at:desc,id:desc`。
          schema: {type: string}
      responses:
        '200':
          description: 分页上传记录
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoiceUploadListSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
      x-error-codes:
        - PORTAL.PORTAL_USER.CAPABILITY_NOT_GRANTED
  /api/v1/portal/supplier-invoice-uploads/{id}/actions/return:
    post:
      tags: [SupplierInvoiceUploads]
      operationId: returnSupplierInvoiceUpload
      summary: 内部财务退回尚未受理的上传记录
      description: |
        该操作不接受 X-Client=portal，供应商自身不能调用。请求体严格只含 reason 与 row_version，
        服务端经 SupplierInvoiceUploadWritebackPort.return_upload 推进 UPLOADED -> RETURNED；不占号码。
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - $ref: '#/components/parameters/LegalEntityId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/InternalClient'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierInvoiceUploadReturnRequest'
      responses:
        '200':
          description: 上传记录已退回
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Trace-Id:
              $ref: '#/components/headers/XTraceId'
            Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierInvoiceUploadSuccess'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      x-error-codes:
        - PORTAL.SUPPLIER_INVOICE_UPLOAD.STATE_CHANGED
        - PLATFORM.IDEMPOTENCY.KEY_REQUIRED
        - PLATFORM.IDEMPOTENCY.PAYLOAD_MISMATCH
        - PLATFORM.AUTHZ.NOT_FOUND_OR_DENIED
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
  parameters:
    UploadId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LegalEntityId:
      name: X-Legal-Entity-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    PortalClient:
      name: X-Client
      in: header
      required: true
      schema:
        const: portal
    InternalClient:
      name: X-Client
      in: header
      required: true
      schema:
        type: string
        enum: [win, mac, ios, android, ops]
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PortalPageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
  headers:
    XRequestId:
      schema:
        type: string
    XTraceId:
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    IdempotentReplay:
      description: 同一幂等载荷重放时为 true；首次响应可以省略。
      schema:
        type: boolean
  schemas:
    Money:
      type: string
      description: 非负 numeric(18,2) 十进制定点字符串。
      pattern: '^(?:0|[1-9][0-9]{0,15})\.[0-9]{2}$'
    PositiveMoney:
      type: string
      description: 大于 0 的 numeric(18,2) 十进制定点字符串。
      pattern: '^(?:0\.(?:0[1-9]|[1-9][0-9])|[1-9][0-9]{0,15}\.[0-9]{2})$'
    PositiveDecimal6:
      type: string
      description: 大于 0 的 numeric(18,6) 十进制定点字符串。
      pattern: '^(?:0\.(?:0{5}[1-9]|0{4}[1-9][0-9]|0{3}[1-9][0-9]{2}|0{2}[1-9][0-9]{3}|0[1-9][0-9]{4}|[1-9][0-9]{5})|[1-9][0-9]{0,11}\.[0-9]{6})$'
    Rate6:
      type: string
      description: 0 到 1 的 numeric(9,6) 十进制定点字符串。
      pattern: '^(?:0\.[0-9]{6}|1\.000000)$'
    InvoiceIdentifierInput:
      oneOf:
        - title: 统一 20 位编号
          type: object
          additionalProperties: false
          required: [invoice_medium, number_scheme, invoice_no]
          properties:
            invoice_medium:
              type: string
              enum: [ELECTRONIC, PAPER]
            number_scheme: {const: UNIFIED_20}
            invoice_code: {type: 'null'}
            invoice_no:
              type: string
              pattern: '^[0-9]{20}$'
        - title: 旧制代码加号码
          type: object
          additionalProperties: false
          required: [invoice_medium, number_scheme, invoice_code, invoice_no]
          properties:
            invoice_medium:
              type: string
              enum: [ELECTRONIC, PAPER]
            number_scheme: {const: LEGACY_CODE_NUMBER}
            invoice_code:
              type: string
              pattern: '^(?:[0-9]{10}|[0-9]{12})$'
            invoice_no:
              type: string
              pattern: '^[0-9]{8}$'
    SupplierInvoiceUploadLineInput:
      type: object
      additionalProperties: false
      required:
        - line_no
        - purchase_order_id
        - purchase_order_line_id
        - cost_kind
        - quantity
        - net_unit_price
        - tax_rate
        - net_amount
        - tax_amount
        - gross_amount
      properties:
        line_no: {type: integer, minimum: 1, maximum: 32767}
        purchase_order_id: {type: string, format: uuid}
        purchase_order_line_id: {type: string, format: uuid}
        goods_receipt_id: {type: [string, 'null'], format: uuid}
        goods_receipt_line_id: {type: [string, 'null'], format: uuid}
        cost_kind: {type: string, enum: [INVENTORY_TYPE, DIRECT_EXPENSE_TYPE]}
        item_id: {type: [string, 'null'], format: uuid}
        quantity: {$ref: '#/components/schemas/PositiveDecimal6'}
        net_unit_price: {$ref: '#/components/schemas/PositiveDecimal6'}
        tax_rate: {$ref: '#/components/schemas/Rate6'}
        net_amount: {$ref: '#/components/schemas/PositiveMoney'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        gross_amount: {$ref: '#/components/schemas/PositiveMoney'}
      oneOf:
        - title: 未关联收货行
          properties:
            goods_receipt_id: {type: 'null'}
            goods_receipt_line_id: {type: 'null'}
        - title: 已关联收货行
          required: [goods_receipt_id, goods_receipt_line_id]
          properties:
            goods_receipt_id: {type: string, format: uuid}
            goods_receipt_line_id: {type: string, format: uuid}
      description: goods_receipt_id 与 goods_receipt_line_id 同时为空或同时非空；gross_amount 精确等于前两项。
    SupplierInvoiceUploadCreateRequest:
      type: object
      additionalProperties: false
      required: [issued_on, ref_type, ref_id, ref_doc_no, identifier, lines]
      properties:
        issued_on:
          type: string
          format: date
        ref_type:
          type: string
          enum: [PURCHASE_ORDER, GOODS_RECEIPT]
        ref_id:
          type: string
          format: uuid
        ref_doc_no:
          type: string
          minLength: 1
          maxLength: 128
        identifier:
          $ref: '#/components/schemas/InvoiceIdentifierInput'
        lines:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/SupplierInvoiceUploadLineInput'
        attachment_object_ids:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
    SupplierInvoiceUploadReturnRequest:
      type: object
      additionalProperties: false
      required: [reason, row_version]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        row_version:
          type: integer
          minimum: 1
    SupplierInvoiceUploadLine:
      type: object
      additionalProperties: false
      required:
        - id
        - line_no
        - purchase_order_id
        - purchase_order_line_id
        - cost_kind
        - quantity
        - net_unit_price
        - tax_rate
        - net_amount
        - tax_amount
        - gross_amount
      properties:
        id: {type: string, format: uuid}
        line_no: {type: integer, minimum: 1}
        purchase_order_id: {type: string, format: uuid}
        purchase_order_line_id: {type: string, format: uuid}
        goods_receipt_id: {type: [string, 'null'], format: uuid}
        goods_receipt_line_id: {type: [string, 'null'], format: uuid}
        cost_kind: {type: string, enum: [INVENTORY_TYPE, DIRECT_EXPENSE_TYPE]}
        item_id: {type: [string, 'null'], format: uuid}
        quantity: {$ref: '#/components/schemas/PositiveDecimal6'}
        net_unit_price: {$ref: '#/components/schemas/PositiveDecimal6'}
        tax_rate: {$ref: '#/components/schemas/Rate6'}
        net_amount: {$ref: '#/components/schemas/PositiveMoney'}
        tax_amount: {$ref: '#/components/schemas/Money'}
        gross_amount: {$ref: '#/components/schemas/PositiveMoney'}
    SupplierInvoiceUpload:
      type: object
      additionalProperties: false
      required:
        - id
        - doc_no
        - supplier_id
        - issued_on
        - ref_type
        - ref_id
        - ref_doc_no
        - identifier
        - net_amount
        - tax_amount
        - gross_amount
        - status
        - submitted_by_portal_user_id
        - row_version
        - lines
        - created_at
      properties:
        id: {type: string, format: uuid}
        doc_no: {type: string}
        supplier_id: {type: string, format: uuid}
        issued_on: {type: string, format: date}
        ref_type: {type: string, enum: [PURCHASE_ORDER, GOODS_RECEIPT]}
        ref_id: {type: string, format: uuid}
        ref_doc_no: {type: string}
        identifier: {$ref: '#/components/schemas/InvoiceIdentifierInput'}
        net_amount:
          allOf: [{$ref: '#/components/schemas/PositiveMoney'}]
          readOnly: true
        tax_amount:
          allOf: [{$ref: '#/components/schemas/Money'}]
          readOnly: true
        gross_amount:
          allOf: [{$ref: '#/components/schemas/PositiveMoney'}]
          readOnly: true
        status:
          type: string
          enum: [UPLOADED, RETURNED, ACCEPTED]
        return_reason: {type: [string, 'null']}
        accepted_purchase_invoice_id: {type: [string, 'null'], format: uuid}
        submitted_by_portal_user_id: {type: string, format: uuid}
        row_version: {type: integer, minimum: 1}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/SupplierInvoiceUploadLine'}
        created_at: {type: string, format: date-time}
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [page, page_size, total, total_pages]
      properties:
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 50}
        total: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
        next_cursor: {type: [string, 'null']}
    SupplierInvoiceUploadListData:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SupplierInvoiceUpload'}
    SupplierInvoiceUploadSuccess:
      type: object
      additionalProperties: false
      required: [success, data, error, meta, trace_id]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/SupplierInvoiceUpload'}
        error: {type: 'null'}
        meta: {type: object}
        trace_id: {type: string, pattern: '^[0-9a-f]{32}$'}
    SupplierInvoiceUploadListSuccess:
      type: object
      additionalProperties: false
      required: [success, data, error, meta, trace_id]
      properties:
        success: {const: true}
        data: {$ref: '#/components/schemas/SupplierInvoiceUploadListData'}
        error: {type: 'null'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
        trace_id: {type: string, pattern: '^[0-9a-f]{32}$'}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [field, reason, value]
      properties:
        field: {type: string}
        reason: {type: string}
        value: {type: [string, integer, boolean, 'null']}
    AppError:
      type: object
      additionalProperties: false
      required: [code, category, message, details, retryable, incident_no, occurred_at, advice]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*(?:\.[A-Z][A-Z0-9_]*){2,}$'
        category:
          type: string
          enum: [VALIDATION, BUSINESS_CONFLICT, PERMISSION_DENIED, EXTERNAL_SYSTEM, INFRASTRUCTURE]
        message: {type: string}
        details:
          type: array
          items: {$ref: '#/components/schemas/ErrorDetail'}
        retryable: {type: boolean}
        incident_no: {type: string}
        occurred_at: {type: string, format: date-time}
        advice: {type: string}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [success, data, error, meta, trace_id]
      properties:
        success: {const: false}
        data: {type: 'null'}
        error: {$ref: '#/components/schemas/AppError'}
        meta: {type: 'null'}
        trace_id: {type: string, pattern: '^[0-9a-f]{32}$'}
  responses:
    Error400:
      description: 输入、号码、行金额或税额校验失败
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Error403:
      description: 门户能力或内部权限不足
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Error404:
      description: 记录不存在或无权访问；不泄露存在性
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Error409:
      description: 状态、内容、重复、并发或幂等冲突
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    Error503:
      description: 基础设施暂时不可用
      headers:
        X-Request-Id: {$ref: '#/components/headers/XRequestId'}
        X-Trace-Id: {$ref: '#/components/headers/XTraceId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
